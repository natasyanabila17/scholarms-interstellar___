<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholarships | Student Scholarship Management System</title>
  <meta name="description" content="Browse available scholarships, quotas, requirements and deadlines, and check which ones you qualify for.">
  <meta name="author" content="Natasya Nabila">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060A'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='3' fill='none' stroke='%23E8A15B' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000' stroke='%23E8A15B' stroke-width='1.3'/%3E%3Cpath d='M2 16a14 3 0 0 0 28 0' fill='none' stroke='%23E8A15B' stroke-width='1.8'/%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app-nav"></div>

  <main id="main" class="container py-4" tabindex="-1">
    <header class="mb-4">
      <p class="eyebrow">Launch catalogue</p>
        <h1 class="h3 mb-1">Scholarships</h1>
      <p class="text-body-secondary mb-0">Available awards, quotas and requirements.</p>
    </header>

    <!-- Eligibility checker -->
    <section class="card shadow-sm mb-3" aria-labelledby="checkHeading">
      <div class="card-body">
        <h2 class="h6" id="checkHeading"><i class="bi bi-patch-question me-2" aria-hidden="true"></i>Which scholarships can I apply for?</h2>
        <form id="checkForm" class="row g-2 align-items-start" novalidate>
          <div class="col-sm-5 col-md-4">
            <label for="checkCgpa" class="visually-hidden">Your CGPA</label>
            <input type="number" id="checkCgpa" class="form-control" placeholder="Enter your CGPA (0.00 - 4.00)" min="0" max="4" step="0.01" required>
            <div class="invalid-feedback">Enter a CGPA between 0.00 and 4.00.</div>
          </div>
          <div class="col-sm-3 col-md-2"><button type="submit" class="btn btn-primary w-100">Check</button></div>
          <div class="col-12 col-md-6" id="checkResult" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <section class="card shadow-sm mb-4" aria-label="Filters">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-6">
            <label for="searchInput" class="form-label small mb-1">Search</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
              <input type="search" id="searchInput" class="form-control" placeholder="Scholarship name">
            </div>
          </div>
          <div class="col-md-3">
            <label for="categoryFilter" class="form-label small mb-1">Category</label>
            <select id="categoryFilter" class="form-select"><option value="">All</option></select>
          </div>
          <div class="col-md-3">
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="openOnly">
              <label class="form-check-label" for="openOnly">Open only</label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
    <div class="row g-3" id="grid" aria-live="polite"></div>
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scholarships.js"></script>
</body>
</html>
